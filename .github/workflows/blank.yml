name: Sincronizar con Repositorio B

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código de A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enviar cambios a B
        env:
          TOKEN: ${{ secrets.REPO_B_TOKEN }}
        run: |
          git remote add destination https://x-access-token:${TOKEN}@github.com/AwildSebitas/TestAdventure.git
          git push --force destination HEAD:main
